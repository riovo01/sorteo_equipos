<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de miniaturas · La Caimanera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f2f0e9;--paper-2:#ffffff;--ink:#141414;--muted:#6f6f68;
    --line:rgba(20,20,20,.16);--line-2:rgba(20,20,20,.08);
    --cream:#f2e6c2;--green:#2f7a3c;--danger:#c0301a;--radius:6px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;
    line-height:1.4;min-height:100vh;-webkit-font-smoothing:antialiased}
  a{color:var(--green)}

  header{max-width:1200px;margin:0 auto;padding:22px 20px 4px}
  header h1{margin:0;font-family:"Anton",sans-serif;font-size:clamp(22px,4vw,30px);
    text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
  header p{margin:8px 0 0;color:var(--muted);font-size:14px}

  main{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:340px 1fr;
    gap:24px;padding:18px 20px 44px}

  form{background:var(--paper-2);border:1.5px solid var(--ink);border-radius:var(--radius);
    box-shadow:5px 5px 0 rgba(20,20,20,.07);padding:18px;
    display:flex;flex-direction:column;gap:13px;align-self:start}
  label{display:flex;flex-direction:column;gap:5px;
    font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
  input{font:inherit;font-weight:600;font-size:15px;padding:11px 12px;border-radius:5px;
    border:1.5px solid var(--line);background:var(--paper);color:var(--ink);
    text-transform:none;letter-spacing:normal}
  input:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:var(--ink)}

  .btns{display:flex;gap:8px;margin-top:4px}
  button{font-family:inherit;cursor:pointer;border:none}
  .btns button{flex:1;border-radius:5px;padding:12px 14px;font-weight:800;font-size:13px;
    letter-spacing:.02em;min-height:44px;border:1.5px solid var(--ink);
    transition:transform .06s ease,background .12s ease,color .12s ease}
  .btns button:active{transform:translateY(1px)}
  #generar{background:var(--ink);color:#fff}
  #generar:hover{background:#000}
  #descargar{background:var(--paper-2);color:var(--ink)}
  #descargar:hover{background:var(--cream)}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .preview{display:flex;flex-direction:column;gap:10px}
  canvas{width:100%;max-width:1280px;height:auto;border:1.5px solid var(--ink);
    border-radius:var(--radius);box-shadow:5px 5px 0 rgba(20,20,20,.07);background:#000}
  .hint{color:var(--muted);font-size:13px}

  @media (max-width:860px){ main{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <h1>Generador de miniaturas · La Caimanera</h1>
  <p>Cambie los cuatro textos, genere la imagen y descárguela en 1280×720.</p>
</header>
<main>
  <form id="f">
    <label>Etiqueta superior
      <input id="t1" value="LA CAIMANERA" maxlength="30">
    </label>
    <label>Título grande (amarillo)
      <input id="t2" value="¡GOLAZOS!" maxlength="14">
    </label>
    <label>Subtítulo (blanco, se parte en dos líneas)
      <input id="t3" value="QUE NADIE VIO VENIR" maxlength="34">
    </label>
    <label>Etiqueta roja
      <input id="t4" value="TOP 10 DEL AÑO" maxlength="24">
    </label>
    <label>Ubicación (aparece abajo con un pin)
      <input id="t5" value="Medellín, Colombia" maxlength="34">
    </label>
    <div class="btns">
      <button type="submit" id="generar">Generar imagen</button>
      <button type="button" id="descargar">Descargar PNG</button>
    </div>
  </form>
  <div class="preview">
    <canvas id="c" width="1280" height="720"></canvas>
    <span class="hint">Vista previa a tamaño real de YouTube (1280×720).</span>
  </div>
</main>

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 1280, H = 720;
const logo = new Image();
logo.src = LOGO_SRC;

function font(sz){ return `700 ${sz}px Poppins, "Arial Black", sans-serif`; }

// texto con contorno + sombra, igual al original
function outlined(text, x, y, sz, fill, sw){
  ctx.font = font(sz);
  ctx.textBaseline = 'top';
  ctx.lineJoin = 'round';
  ctx.lineWidth = sw*2;
  // sombra
  ctx.strokeStyle = 'rgba(0,0,0,.63)';
  ctx.fillStyle = 'rgba(0,0,0,.63)';
  ctx.strokeText(text, x+8, y+10); ctx.fillText(text, x+8, y+10);
  // texto
  ctx.strokeStyle = '#0a190c';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(text, x, y);
}

function fitSize(text, maxW, base, min){
  let s = base;
  ctx.font = font(s);
  while (ctx.measureText(text).width > maxW && s > min){ s -= 4; ctx.font = font(s); }
  return s;
}

function splitTwo(text){
  const words = text.trim().split(/\s+/);
  if (words.length < 2) return [text, ''];
  let best = null, bestDiff = Infinity;
  for (let i=1;i<words.length;i++){
    const a = words.slice(0,i).join(' '), b = words.slice(i).join(' ');
    const d = Math.abs(a.length - b.length);
    if (d < bestDiff){ bestDiff = d; best=[a,b]; }
  }
  return best;
}

function roundRect(x,y,w,h,r,fill){
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fillStyle = fill; ctx.fill();
}

function draw(){
  const t1 = document.getElementById('t1').value || ' ';
  const t2 = document.getElementById('t2').value || ' ';
  const t3 = document.getElementById('t3').value || ' ';
  const t4 = document.getElementById('t4').value || ' ';
  const t5 = document.getElementById('t5').value.trim();

  // fondo degradado
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgb(20,90,35)'); g.addColorStop(1,'rgb(8,28,14)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // rayos de luz desde arriba a la derecha
  ctx.save();
  ctx.filter = 'blur(6px)';
  ctx.fillStyle = 'rgba(200,255,200,.086)';
  const cx=1180, cy=-80;
  for (let i=0;i<14;i++){
    const a1=(95+i*8)*Math.PI/180, a2=a1+3.5*Math.PI/180;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.lineTo(cx+2200*Math.cos(a1), cy+2200*Math.sin(a1));
    ctx.lineTo(cx+2200*Math.cos(a2), cy+2200*Math.sin(a2));
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // líneas de cancha
  ctx.strokeStyle = 'rgba(255,255,255,.24)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0,690); ctx.lineTo(W,690); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(640,730,200,170,0,Math.PI,2*Math.PI); ctx.stroke();

  // franja diagonal amarilla
  ctx.fillStyle = 'rgba(255,200,40,.157)';
  ctx.beginPath(); ctx.moveTo(700,0); ctx.lineTo(790,0); ctx.lineTo(560,H); ctx.lineTo(470,H); ctx.closePath(); ctx.fill();

  // logo con brillo
  ctx.save();
  ctx.shadowColor = 'rgba(255,220,60,.9)'; ctx.shadowBlur = 45;
  ctx.drawImage(logo, 760, 90, 560, 560);
  ctx.restore();
  ctx.drawImage(logo, 760, 90, 560, 560);

  // etiqueta superior
  ctx.font = font(34); ctx.textBaseline='top';
  let w = ctx.measureText(t1).width;
  roundRect(50,48,w+40,60,12,'#f0e2aa');
  ctx.fillStyle = '#162814'; ctx.fillText(t1,70,55);

  // título grande
  const s2 = fitSize(t2, 690, 150, 90);
  outlined(t2, 48, 150 + (150-s2)/2, s2, '#ffd228', 10);

  // subtítulo en dos líneas
  const [l1,l2] = splitTwo(t3);
  const s3 = Math.min(fitSize(l1,660,96,56), fitSize(l2||l1,660,96,56));
  outlined(l1, 52, 335, s3, '#ffffff', 8);
  if (l2) outlined(l2, 52, 335 + s3*1.15, s3, '#ffffff', 8);

  // etiqueta roja
  ctx.font = font(38);
  w = ctx.measureText(t4).width;
  roundRect(50,590,w+50,70,14,'#dc1e28');
  ctx.fillStyle = '#fff'; ctx.fillText(t4,75,598);

  // ubicación con pin, abajo a la derecha
  if (t5){
    ctx.font = font(30);
    const tw = ctx.measureText(t5).width;
    const pw = tw + 90, ph = 56;
    const px = W - 40 - pw, py = H - 20 - ph;
    roundRect(px, py, pw, ph, 28, 'rgba(0,0,0,.6)');
    drawPin(px + 34, py + ph/2, '#ffd228');
    ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle';
    ctx.fillText(t5, px + 62, py + ph/2 + 1);
    ctx.textBaseline = 'top';
  }
}

function drawPin(x, y, color){
  // pin tipo mapa: gota con círculo interno
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, 18);
  ctx.bezierCurveTo(-14, 2, -14, -8, -14, -8);
  ctx.arc(0, -8, 14, Math.PI, 0);
  ctx.bezierCurveTo(14, -8, 14, 2, 0, 18);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#0a190c';
  ctx.beginPath(); ctx.arc(0, -8, 6, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

async function ready(){
  try { await document.fonts.load('700 100px Poppins'); } catch(e){}
  if (!logo.complete) await new Promise(r => logo.onload = r);
  draw();
}
ready();

document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); draw(); });
document.getElementById('descargar').addEventListener('click', () => {
  draw();
  const a = document.createElement('a');
  a.download = 'miniatura_la_caimanera.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});
</script>
